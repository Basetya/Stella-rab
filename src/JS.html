<script>
  let sessionUser = "", sessionRole = "", chartInstance = null, allHistory = [], currentUploadedImageBase64 = "", activeChartMode = "fixture", wasDragging = false; 

  document.addEventListener("DOMContentLoaded", () => {
    initializeChart();
    makeWidgetDraggable();
  });
  
  function showLoading(show, msg = "Memproses...") { 
    const overlay = document.getElementById("loadingOverlay"); 
    if(document.getElementById("loadingMsg")) document.getElementById("loadingMsg").innerText = msg; 
    if(show) overlay.classList.remove("hidden"); else overlay.classList.add("hidden"); 
  }
  
  function toggleView(id) { 
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden')); 
    document.getElementById(id).classList.remove('hidden'); 
  }

  function executeLogin() {
    const u = document.getElementById("inputUser").value.trim(), p = document.getElementById("inputPass").value.trim();
    if(!u || !p) return alert("Isi Username dan Password!");
    showLoading(true, "Otentikasi System...");
    google.script.run
      .withFailureHandler(err => { showLoading(false); alert("Server Error: " + err.message); })
      .withSuccessHandler(res => {
        showLoading(false);
        if(res.success) {
          sessionUser = res.user.username; sessionRole = res.user.role;
          document.getElementById("sessUser").innerText = sessionUser; document.getElementById("sessRole").innerText = sessionRole;
          document.getElementById("loginScreen").classList.add("hidden"); 
          document.getElementById("appScreen").classList.remove("hidden");
          document.getElementById("floatingChartWidget").classList.remove("hidden");
          if(document.getElementById("calculatorBody").children.length===0) addNewRow();
          checkForSavedWorkspace();
        } else alert(res.error);
      }).loginUser(u, p);
  }

  function triggerAI() {
    const fileInput = document.getElementById('aiFileInput');
    const files = fileInput.files;
    if(files.length === 0) return alert("Pilih minimal satu file (Gambar desain atau daftar material)!");
    
    showLoading(true, `AI sedang memproses ${files.length} file dokumen...`);
    
    const promises = Array.from(files).map(file => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          resolve({
            base64Data: e.target.result,
            mimeType: file.type
          });
        };
        reader.onerror = err => reject(err);
        reader.readAsDataURL(file);
      });
    });
    
    Promise.all(promises).then(extractedFiles => {
      // Simpan gambar pertama sebagai base64 untuk chat brainstorm jika formatnya gambar
      const firstImage = extractedFiles.find(f => f.mimeType.startsWith("image/"));
      if (firstImage) currentUploadedImageBase64 = firstImage.base64Data;
      
      google.script.run.withSuccessHandler(res => {
        showLoading(false);
        if(res.success) { 
          const tbody = document.getElementById("calculatorBody"); tbody.innerHTML = ""; 
          res.items.forEach(item => appendRowUI(item.fixtureName, item.materialName, item.qty, item.estimatedPrice, "#", item.unit || "ea"));
          recalculateGrandTotal();
          alert(`✅ Berhasil mengekstrak komponen dari ${files.length} file dokumen! Silakan lakukan validasi harga.`); 
        } else alert("❌ Error AI: " + res.error);
      }).processAIExtractionMultiple(extractedFiles, sessionUser, sessionRole);
    }).catch(err => {
      showLoading(false);
      alert("Gagal membaca beberapa file: " + err.toString());
    });
  }

  function addNewRow() { appendRowUI("", "", 1.00, 0, "#", "ea"); }
  
  function appendRowUI(fixName, matName, qty, price, refUrl = "#", unit = "ea") {
    const tbody = document.getElementById("calculatorBody");
    const rowId = "row_" + Date.now() + "_" + Math.floor(Math.random()*1000);

    tr.innerHTML = `
      <td class="p-3 md:p-4 flex flex-col md:table-cell border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400 mb-1">Fixture</span>
         <input type="text" value="${fixName}" oninput="saveWorkspaceToLocalStorage()" class="fixture-name w-full p-2 bg-transparent border border-slate-200 md:border-0 rounded-lg outline-none font-medium" placeholder="Bagian Ruangan">
      </td>
      <td class="p-3 md:p-4 flex flex-col md:table-cell border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400 mb-1">Material</span>
         <input type="text" value="${matName}" oninput="saveWorkspaceToLocalStorage()" class="material-name w-full p-2 bg-transparent border border-slate-200 md:border-0 rounded-lg outline-none font-bold text-blue-700" placeholder="Nama Material">
      </td>
      <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Satuan</span>
         <input type="text" value="${unit}" oninput="saveWorkspaceToLocalStorage()" class="unit-input w-16 p-2 text-center border border-slate-200 rounded-xl font-bold bg-slate-50 text-slate-900 text-xs" placeholder="ea">
      </td>
      <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">QTY</span>
         <input type="number" step="0.01" value="${qty}" oninput="calcRow('${rowId}')" class="qty-input w-24 p-2 text-center border border-slate-200 rounded-xl font-bold bg-slate-50">
      </td>
      <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Harga Satuan</span>
         <div class="flex items-center font-mono">Rp <input type="number" value="${price}" oninput="calcRow('${rowId}')" class="custom-price-input w-28 p-2 border border-slate-200 rounded-xl font-bold bg-slate-50 text-slate-900 ml-1"></div>
      </td>
      <td class="p-3 md:p-4 flex flex-col justify-center items-center border-b md:border-0 border-slate-100 gap-1">
         <div class="grid grid-cols-2 gap-1 w-full max-w-[180px] md:max-w-none">
            <button onclick="runGeminiResearch('${rowId}')" title="Gemini AI Google Search Grounding (Direkomendasikan - Sangat Akurat)" class="col-span-2 text-[9px] bg-purple-600 hover:bg-purple-700 text-white p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 shadow-sm shadow-purple-500/20">🤖 AI (Grounding)</button>
            <button onclick="runSerpApiResearch('${rowId}')" title="Google Shopping via SerpApi (Kuota Premium)" class="text-[9px] bg-amber-50 hover:bg-amber-100 text-amber-700 p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 border border-amber-200/50">⚡ Serp</button>
            <button onclick="openManualWebSearch('${rowId}')" title="Cari Manual Gratis via Tab Baru" class="text-[9px] bg-slate-50 hover:bg-slate-100 text-slate-700 p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 border border-slate-200/50">🔍 Web</button>
         </div>
         <div class="ref-link-area text-center w-full mt-1">${hasLink ? `<a href="${refUrl}" target="_blank" class="text-[10px] text-emerald-600 underline font-bold">Lihat Link</a>` : ''}</div>
      </td>
      <td class="p-4 md:p-4 flex justify-between items-center md:table-cell bg-slate-50 md:bg-transparent border-b md:border-0 border-slate-100">
         <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Subtotal</span>
         <span class="subtotal-label text-right font-black font-mono text-lg md:text-base text-slate-900">Rp 0</span>
      </td>
      <td class="p-3 md:p-4 flex justify-center items-center bg-rose-50/50 md:bg-transparent">
         <button onclick="document.getElementById('${rowId}').remove(); recalculateGrandTotal();" class="text-rose-500 font-bold p-2 w-full md:w-auto rounded-lg">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
    calcRow(rowId);
  }

  // Fungsi Hemat Kuota (Buka Web Browser Gratis dengan Asisten Rujukan Harga)
  function openManualWebSearch(rowId) {
    const row = document.getElementById(rowId); 
    if (!row) return;
    const matName = row.querySelector(".material-name").value.trim();
    if(!matName) return alert("Silakan isi nama material terlebih dahulu!");
    
    // 1. Buka Google Shopping di Tab Baru
    const query = encodeURIComponent("Harga " + matName);
    window.open(`https://www.google.co.id/search?tbm=shop&q=${query}`, "_blank");
    
    // 2. Injeksi & Munculkan Modal Rujukan Manual
    let modal = document.getElementById("manualSearchModal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "manualSearchModal";
      modal.className = "fixed inset-0 flex justify-center items-center p-3 z-50 bg-slate-950/80 backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none";
      document.body.appendChild(modal);
    }
    
    modal.innerHTML = `
      <div class="bg-slate-900/95 border border-white/10 p-6 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-white space-y-5 transform scale-95 transition-all duration-300">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <h3 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 flex items-center gap-1.5">🔍 Rujukan Harga Manual</h3>
          <button onclick="closeManualSearchModal()" class="text-slate-400 hover:text-white text-xs bg-white/5 hover:bg-white/10 p-1.5 rounded-full transition cursor-pointer">✕</button>
        </div>
        
        <div class="space-y-1">
          <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Nama Material:</p>
          <p class="text-xs font-black text-blue-300 bg-white/5 p-3 rounded-xl border border-white/5 truncate">${matName}</p>
        </div>
        
        <div class="space-y-3">
          <div class="space-y-1">
            <label class="text-[9px] uppercase font-bold text-slate-400 ml-1">Berapa harga yang Anda temukan?</label>
            <div class="relative flex items-center">
              <span class="absolute left-4 text-xs font-black text-slate-400">Rp</span>
              <input type="number" id="modalPriceInput" placeholder="Masukkan angka saja..." class="w-full p-3.5 pl-10 bg-slate-950/50 border border-white/10 rounded-2xl outline-none focus:border-blue-500 text-sm font-bold text-white transition">
            </div>
          </div>
          
          <div class="space-y-1">
            <label class="text-[9px] uppercase font-bold text-slate-400 ml-1">Link URL Toko (Opsional)</label>
            <input type="text" id="modalUrlInput" placeholder="Tempel link Tokopedia/Shopee/dll..." class="w-full p-3.5 bg-slate-950/50 border border-white/10 rounded-2xl outline-none focus:border-blue-500 text-[10px] font-medium text-slate-350 transition">
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 pt-1">
          <button onclick="applyManualPrice('${rowId}', false)" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white p-3 rounded-xl text-[11px] font-black transition shadow-lg shadow-blue-500/20 cursor-pointer">✅ Gunakan Harga</button>
          <button onclick="applyManualPrice('${rowId}', true)" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white p-3 rounded-xl text-[11px] font-black transition shadow-lg shadow-emerald-500/20 cursor-pointer">➕ Jadi Master</button>
        </div>
      </div>
    `;
    
    // Tampilkan modal dengan animasi halus
    setTimeout(() => {
      modal.classList.remove("opacity-0", "pointer-events-none");
      modal.querySelector("div").classList.remove("scale-95");
    }, 50);
  }

  function closeManualSearchModal() {
    const modal = document.getElementById("manualSearchModal");
    if (modal) {
      modal.querySelector("div").classList.add("scale-95");
      modal.classList.add("opacity-0", "pointer-events-none");
    }
  }

  function applyManualPrice(rowId, saveToMaster = false) {
    const priceInput = document.getElementById("modalPriceInput");
    const urlInput = document.getElementById("modalUrlInput");
    if (!priceInput) return;
    
    const price = parseFloat(priceInput.value) || 0;
    const url = (urlInput ? urlInput.value.trim() : "") || "#";
    
    if (price <= 0) return alert("Masukkan harga rujukan yang valid (lebih besar dari 0)!");
    
    const row = document.getElementById(rowId);
    if (!row) return;
    const matName = (row.querySelector(".material-name").value || "").trim();
    const matUnit = (row.querySelector(".unit-input") ? row.querySelector(".unit-input").value : "ea");
    
    // 1. Jalankan visual rujukan harga ke baris lokal
    const dummyRes = {
      success: true,
      data: {
        actualPrice: price,
        sourceUrl: url
      }
    };
    
    handleResearchResult(rowId, dummyRes, "Manual Web");
    closeManualSearchModal();
    playChimeSoftly();
    showToast(`Berhasil menerapkan harga rujukan: Rp ${price.toLocaleString('id-ID')}`, "success");
    
    // 2. Jika dipilih "Jadikan Master", kirim data ke Google Sheets Master
    if (saveToMaster) {
      setTimeout(() => {
        pushRowToMaster(rowId, btoa(encodeURIComponent(matName)), price, matUnit, url);
      }, 500);
    }
  }

  // Batch menu controls
  function toggleBatchMenu(event) {
    event.stopPropagation();
    const menu = document.getElementById("batchMenu");
    menu.classList.toggle("hidden");
  }
  
  document.addEventListener("click", () => {
    const menu = document.getElementById("batchMenu");
    if (menu) menu.classList.add("hidden");
  });

  // Individual pricing engine runs
  // Individual pricing engine runs
  function playChimeSoftly() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const now = ctx.currentTime;
      
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.50, now); 
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    } catch (e) {
      console.error(e);
    }
  }

  function runSerpApiResearch(rowId) {
    const row = document.getElementById(rowId); 
    if (!row) return;
    const name = (row.querySelector(".material-name").value || "").trim();
    if(!name) return showToast("Nama material kosong!", "error");
    
    row.classList.remove("row-success-flash", "row-failed-flash");
    row.classList.add("row-validating-glow");
    lockRowInputs(rowId, true);
    
    showToast(`Meriset via SerpApi: "${name}"...`, "info");
    
    google.script.run
      .withFailureHandler(err => {
        row.classList.remove("row-validating-glow");
        lockRowInputs(rowId, false);
        row.classList.add("row-failed-flash");
        showToast(`Koneksi Gagal: ${err.message}`, "error");
      })
      .withSuccessHandler(res => {
        row.classList.remove("row-validating-glow");
        lockRowInputs(rowId, false);
        
        handleResearchResult(rowId, res, "SerpApi");
        
        if (res.success && res.data.actualPrice > 0) {
          row.classList.add("row-success-flash");
          showToast(`"${name}" divalidasi: Rp ${res.data.actualPrice.toLocaleString('id-ID')}`, "success");
          playChimeSoftly();
        }
      }).deepResearchMaterial(name);
  }

  function runGeminiResearch(rowId) {
  const row = document.getElementById(rowId); 
  if (!row) return;
  const name = (row.querySelector(".material-name").value || "").trim();
  if(!name) return showToast("Nama material kosong!", "error");
  
  row.classList.remove("row-success-flash", "row-failed-flash");
  row.classList.add("row-validating-glow");
  lockRowInputs(rowId, true);
  
  showToast(`Mengecek harga "${name}"...`, "info");
  
  google.script.run
    .withFailureHandler(err => {
      row.classList.remove("row-validating-glow");
      lockRowInputs(rowId, false);
      row.classList.add("row-failed-flash");
      showToast(`Koneksi Gagal: ${err.message}`, "error");
    })
    .withSuccessHandler(res => {
      row.classList.remove("row-validating-glow");
      lockRowInputs(rowId, false);
      
      // Menentukan label sumber untuk ditampilkan di UI
      const sourceLabel = res.source === "MASTER" ? "Master Database" : "Gemini AI";
      handleResearchResult(rowId, res, sourceLabel);
      
      if (res.success && res.data.actualPrice > 0) {
        row.classList.add("row-success-flash");
        
        // Indikator Toast UI: Membedakan notifikasi Master vs AI
        if(res.source === "MASTER") {
           showToast(`✅ [MASTER] "${name}": Rp ${res.data.actualPrice.toLocaleString('id-ID')}`, "success");
        } else {
           showToast(`🤖 [AI] "${name}" grounded: Rp ${res.data.actualPrice.toLocaleString('id-ID')}`, "success");
        }
        playChimeSoftly();
      }
    }).getBestPrice(name); // <-- TRIGGER UTAMA BERUBAH: Sekarang memanggil fungsi hierarki kita
}

 function handleResearchResult(rowId, res, sourceName) {
  const row = document.getElementById(rowId);
  if (!row) return;
  
  if (res.success && res.data.actualPrice > 0) {
    const currentPrice = row.querySelector(".custom-price-input").value;
    const currentRefArea = row.querySelector(".ref-link-area").innerHTML;
    row.setAttribute("data-prev-price", currentPrice);
    row.setAttribute("data-prev-ref", currentRefArea);

    const priceInput = row.querySelector(".custom-price-input");
    priceInput.value = res.data.actualPrice;
    

    // 1. Definisikan semua data terlebih dahulu (PENTING: Mencegah ReferenceError!)
    const displayUrl = res.data.sourceUrl && res.data.sourceUrl !== "#" ? res.data.sourceUrl : "";
    const matName = (row.querySelector(".material-name").value || "").trim();
    // Gunakan selektor .unit-input yang benar (bukan .material-unit)
    const matUnit = (row.querySelector(".unit-input") ? row.querySelector(".unit-input").value : "ea");
    
    // 2. Tweak Visual Berdasarkan Sumber Data
    if (sourceName === "Master Database") {
      priceInput.className = "custom-price-input w-28 p-2 border-2 border-emerald-500 rounded-xl font-black bg-emerald-50 text-emerald-900 ml-1 transition-all";
    } else {
      priceInput.className = "custom-price-input w-28 p-2 border-2 border-purple-400 rounded-xl font-bold bg-purple-50/50 text-purple-950 ml-1 transition-all";
    }
    
    let refHtml = "";
    if (sourceName === "Master Database") {
      refHtml = `<span class="text-[9px] bg-emerald-600 text-white px-2 py-0.5 rounded-md font-black shadow-sm" title="Data diambil dari Master Harga lokal">📋 MASTER</span>`;
    } else {
      // JIKA DARI AI: Berikan tombol tambahan untuk Simpan ke Master (Tahap 3)
      const saveBtnHtml = `<button onclick="pushRowToMaster('${rowId}', '${btoa(encodeURIComponent(matName))}', ${res.data.actualPrice}, '${matUnit}', '${displayUrl}')" class="text-[9px] bg-indigo-600 hover:bg-indigo-700 text-white px-1.5 py-0.5 rounded font-bold shadow-xs transition-all mt-1 flex items-center gap-0.5">➕ Jadikan Master</button>`;
      
      if (displayUrl) {
        refHtml = `<div class="flex flex-col items-center"><a href="${displayUrl}" target="_blank" class="text-[10px] bg-purple-100 text-purple-700 hover:bg-purple-200 border border-purple-200 px-1.5 py-0.5 rounded-md font-black transition decoration-none" title="Sumber: Live Web Search via ${sourceName}">🌐 Link AI</a> ${saveBtnHtml}</div>`;
      } else {
        refHtml = `<div class="flex flex-col items-center"><span class="text-[10px] bg-slate-100 text-slate-600 border border-slate-200 px-1.5 py-0.5 rounded-md font-bold" title="Sumber: Estimasi AI">🤖 ${sourceName}</span> ${saveBtnHtml}</div>`;
      }
    }
    
    row.setAttribute("data-researched-price", res.data.actualPrice);
    
    const researchedRefHtml = `<div class="flex flex-col items-center gap-1 mt-1">${refHtml} <button onclick="undoPrice('${rowId}')" title="Kembalikan ke harga sebelum riset" class="text-[9px] text-slate-400 hover:text-slate-700 underline font-medium transition">↩️ Undo</button></div>`;
    row.setAttribute("data-researched-ref", researchedRefHtml);

    row.querySelector(".ref-link-area").innerHTML = researchedRefHtml;
    calcRow(rowId);
  } else {
    row.querySelector(".ref-link-area").innerHTML = `<span class="text-[10px] bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-md font-black">✕ API Gagal</span>`;
    row.classList.add("row-failed-flash");
    showToast(`Pencarian gagal (${sourceName}): ${res.error || 'Harga tidak ditemukan.'}`, "error");
  }
}

/**
 * FUNGSI TRIGGER UI: Mengirim data baris lokal ke server Google Sheet
 */
function pushRowToMaster(rowId, encodedName, price, unit, refUrl) {
  const decodedName = decodeURIComponent(atob(encodedName));
  showToast(`Menyimpan "${decodedName}" ke database master...`, "info");
  
  const payload = {
    itemName: decodedName,
    unitPrice: price,
    unit: unit,
    refUrl: refUrl,
    conversionFactor: 1, // Default diisi angka 1 sesuai aturan emas
    currentUser: (typeof currentUser !== 'undefined' ? currentUser : "Stella Owner")
  };
  
  google.script.run
    .withFailureHandler(err => {
      showToast(`Gagal menyimpan: ${err.message}`, "error");
    })
    .withSuccessHandler(res => {
      if(res.success) {
        showToast(`✅ Berhasil! "${decodedName}" resmi jadi acuan harga Master (${res.materialId}).`, "success");
        // Update visual area baris tersebut langsung menjadi hijau (karena statusnya sudah resmi jadi master)
        const row = document.getElementById(rowId);
        if(row) {
          const priceInput = row.querySelector(".custom-price-input");
          priceInput.className = "custom-price-input w-28 p-2 border-2 border-emerald-500 rounded-xl font-black bg-emerald-50 text-emerald-900 ml-1 transition-all";
          row.querySelector(".ref-link-area").innerHTML = `<div class="flex flex-col items-center gap-1 mt-1"><span class="text-[9px] bg-emerald-600 text-white px-2 py-0.5 rounded-md font-black shadow-sm">📋 MASTER</span></div>`;
        }
      } else {
        showToast(`Gagal: ${res.error}`, "error");
      }
    }).saveNewItemToMaster(payload);
}


  function undoPrice(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const prevPrice = row.getAttribute("data-prev-price");
    const prevRef = row.getAttribute("data-prev-ref");
    if (prevPrice !== null) {
      row.querySelector(".custom-price-input").value = prevPrice;
      
      // Ambil referensi HTML sebelumnya, hilangkan tombol undo/redo lama
      let prevRefHtml = prevRef || "";
      prevRefHtml = prevRefHtml.replace(/<button.*?>.*?Undo<\/button>/g, "").replace(/<button.*?>.*?Redo<\/button>/g, "");
      
      // Tambahkan tombol Redo ke dalam HTML referensi lama tersebut
      const undoRefHtml = prevRefHtml + ` <button onclick="redoPrice('${rowId}')" title="Kembalikan ke harga hasil riset" class="text-[10px] text-blue-600 hover:text-blue-800 underline font-bold ml-1.5">↪️ Redo</button>`;
      
      row.querySelector(".ref-link-area").innerHTML = undoRefHtml;
      calcRow(rowId);
    } else {

  function showToast(message, type = "success") {
    const existing = document.querySelectorAll(".custom-toast");
    existing.forEach(t => t.remove());

    const toast = document.createElement("div");
    toast.className = `custom-toast custom-toast-${type}`;
    
    let icon = "🔔";
    if (type === "success") icon = "🎉";
    else if (type === "error") icon = "❌";
    else if (type === "info") icon = "ℹ️";
    
    toast.innerHTML = `
      <span class="text-lg">${icon}</span>

    `;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateY(-10px)";
      setTimeout(() => toast.remove(), 300);
    }, 4500);

  function playCompletionChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const now = ctx.currentTime;
      
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(830.61, now); 
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.12, now + 0.05);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.5);
      
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1046.50, now + 0.15); 
      gain2.gain.setValueAtTime(0, now + 0.15);
      gain2.gain.linearRampToValueAtTime(0.12, now + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.8);
    } catch (e) {
      console.error("Audio Context failed: ", e);
    }
  }

  async function validateBatchSingle(batchNum, isSequencing = false) {
    const idx = batchNum - 1;
    const batch = activeBatches[idx];
    if (!batch || batch.length === 0) return;
    
    const card = document.getElementById(`batchCard_${batchNum}`);
    const badge = document.getElementById(`batchStatus_${batchNum}`);
    const btn = document.getElementById(`batchBtn_${batchNum}`);
    
    badge.innerText = "RUNNING";
    badge.className = "batch-status-badge text-[9px] font-black px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200 animate-pulse";
    
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin h-3.5 w-3.5 border-2 border-indigo-600 border-t-transparent rounded-full mr-1.5 inline-block"></span> Memproses...`;
    }
    
    const delay = parseInt(document.getElementById("batchDelaySelect").value) || 5000;
    let successCount = 0;
    
    for (let i = 0; i < batch.length; i++) {
      if (cancelValidationSignal) break;
      
      const item = batch[i];
      const row = document.getElementById(item.rowId);
      
      if (!item.materialName) {
        successCount++;
        continue;
      }
      
      if (row) {
        row.classList.remove("row-success-flash", "row-failed-flash");
        row.classList.add("row-validating-glow");
        lockRowInputs(item.rowId, true);
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      
      const progressText = document.getElementById("progressPillText");
      if (progressText) {
        progressText.innerHTML = `Batch ${batchNum} (${i + 1}/${batch.length}): "${item.materialName.substring(0, 15)}..."`;
      }
      
      if (i > 0) {
        await new Promise(resolve => setTimeout(resolve, delay));
      }
      
      if (cancelValidationSignal) {
        if (row) {
          row.classList.remove("row-validating-glow");
          lockRowInputs(item.rowId, false);
        }
        break;
      }
      
      let itemSuccess = false;
      let attempt = 0;
      const maxRetries = 2;
      
      while (!itemSuccess && attempt <= maxRetries && !cancelValidationSignal) {
        if (attempt > 0) {
          await new Promise(resolve => setTimeout(resolve, 15000));
        }
        
        if (cancelValidationSignal) break;
        
        await new Promise((resolve) => {
          const successHandler = res => {
            if (row) {
              row.classList.remove("row-validating-glow");
              lockRowInputs(item.rowId, false);
            }
            
            if (res.success && res.data.actualPrice > 0) {
              handleResearchResult(item.rowId, res, batchValidationMode === "SerpApi" ? "SerpApi" : "Gemini AI");
              
              if (row) {
                row.classList.add("row-success-flash");
                const refLinkArea = row.querySelector(".ref-link-area");
                if (refLinkArea && !refLinkArea.innerHTML.includes("✅")) {
                  refLinkArea.innerHTML = `<span class="text-[9px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-black border border-emerald-200 mr-1.5">✅ Grounded</span>` + refLinkArea.innerHTML;
                }
              }
              itemSuccess = true;
              successCount++;
              resolve();
            } else {
              attempt++;
              if (attempt > maxRetries) {
                if (row) row.classList.add("row-failed-flash");
                resolve();
              } else {
                resolve();
              }
            }
          };
          
          if (batchValidationMode === "SerpApi") {
            google.script.run.withSuccessHandler(successHandler).deepResearchMaterial(item.materialName);
          } else {
            google.script.run.withSuccessHandler(successHandler).researchMaterialGeminiSearch(item.materialName);
          }
        });
      }
    }
    
    batch.forEach(item => {
      lockRowInputs(item.rowId, false);
      const row = document.getElementById(item.rowId);
      if (row) row.classList.remove("row-validating-glow");
    });
    
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `🤖 Validasi Batch ${batchNum}`;
    }
    
    if (cancelValidationSignal) {
      badge.innerText = "PENDING";
      badge.className = "batch-status-badge text-[9px] font-black px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200";
      return;
    }
    
    if (successCount === batch.length) {
      badge.innerText = "SUCCESS";
      badge.className = "batch-status-badge text-[9px] font-black px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200";
      if (card) card.className = "batch-glow-card bg-white border border-emerald-200/80 p-4 rounded-2xl flex flex-col justify-between gap-3 shadow-sm hover:shadow-md transition";
      if (!isSequencing) {
        showToast(`Batch ${batchNum} selesai divalidasi!`, "success");
        playCompletionChime();
      }
    } else {
      badge.innerText = "PARTIAL";
      badge.className = "batch-status-badge text-[9px] font-black px-2.5 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-200";
      if (card) card.className = "batch-glow-card bg-white border border-amber-200/80 p-4 rounded-2xl flex flex-col justify-between gap-3 shadow-sm hover:shadow-md transition";
      if (!isSequencing) {
        showToast(`Batch ${batchNum} selesai dengan sebagian item gagal.`, "info");
        playCompletionChime();
      }
    }
  }

  async function validateAllBatchesSequentially() {
    if (activeBatches.length === 0) return alert("Tidak ada batch yang aktif!");
    if (isBackgroundValidating) return alert("Validasi latar belakang sedang berjalan!");
    
    isBackgroundValidating = true;
    cancelValidationSignal = false;
    
    const pill = document.getElementById("floatingProgressPill");
    if (pill) {
      pill.classList.remove("scale-0", "opacity-0", "pointer-events-none");
      pill.classList.add("scale-100", "opacity-100", "pointer-events-auto");
    }
    
    showToast("Validasi massal berjalan di latar belakang. Anda tetap bisa menggunakan halaman!", "info");
    
    const delayBetweenBatches = 8000;
    
    for (let i = 0; i < activeBatches.length; i++) {
      if (cancelValidationSignal) break;
      
      const batchNum = i + 1;
      
      if (i > 0) {
        const progressText = document.getElementById("progressPillText");
        if (progressText) {
          progressText.innerHTML = `Jeda Antar-Batch (${delayBetweenBatches / 1000}s)...`;
        }
        await new Promise(resolve => setTimeout(resolve, delayBetweenBatches));
      }
      
      if (cancelValidationSignal) break;
      
      await validateBatchSingle(batchNum, true);
    }
    
    isBackgroundValidating = false;
    
    if (pill) {
      pill.classList.remove("scale-100", "opacity-100", "pointer-events-auto");
      pill.classList.add("scale-0", "opacity-0", "pointer-events-none");
    }
    
    if (!cancelValidationSignal) {
      showToast("🎉 Seluruh batch validasi latar belakang telah selesai!", "success");
      playCompletionChime();
    }
  }

  function calcRow(id) { 
    const row=document.getElementById(id), p=parseFloat(row.querySelector(".custom-price-input").value)||0, q=parseFloat(row.querySelector(".qty-input").value)||0, sub=p*q; 
    row.querySelector(".subtotal-label").innerText="Rp "+sub.toLocaleString('id-ID'); row.setAttribute("data-subtotal",sub); recalculateGrandTotal(); 
  }
  function recalculateGrandTotal() { 
    const rows = document.getElementById("calculatorBody").children; 
    let baseTotal = 0; 
    let fb = {}; 
    let maxSubtotal = 0;
    let maxSubtotalRowId = null;

    // Reset previous row highlights/warnings
    for(let i=0; i<rows.length; i++) {
      rows[i].classList.remove("border-rose-450", "bg-rose-50/20", "shadow-rose-100/50", "border-rose-400", "bg-rose-50/30");
      const sub = parseFloat(rows[i].getAttribute("data-subtotal"))||0; 
      baseTotal += sub; 
      
      if (sub > maxSubtotal) {
        maxSubtotal = sub;
        maxSubtotalRowId = rows[i].id;
      }

      let name = "";
      if (activeChartMode === "material") {
        name = (rows[i].querySelector(".material-name").value || `Bahan ${i+1}`).trim();
      } else {
        name = (rows[i].querySelector(".fixture-name").value || `Bagian ${i+1}`).trim();
      }
      if(sub>0 && name) fb[name] = (fb[name]||0)+sub; 
    } 

    // 1. Get contingency and markup percentages
    const contingencyRate = parseFloat(document.getElementById("contingencyRate").value)||0;
    const markupRate = parseFloat(document.getElementById("markupRate").value)||0;

    // 2. Sequential Calculation:
    // Subtotal After Contingency = Base * (1 + Contingency/100)
    // Grand Total = Subtotal After Contingency * (1 + Markup/100)
    const subtotalAfterContingency = baseTotal * (1 + contingencyRate / 100);
    const grandTotal = subtotalAfterContingency * (1 + markupRate / 100);
    const multiplierTotal = grandTotal - baseTotal;

    const formattedBase = "Rp " + baseTotal.toLocaleString('id-ID');
    const formattedMultiplier = (multiplierTotal >= 0 ? "+ " : "- ") + "Rp " + Math.abs(Math.round(multiplierTotal)).toLocaleString('id-ID');
    const formattedGrand = "Rp " + Math.round(grandTotal).toLocaleString('id-ID');

    // Update labels in UI
    const baseTotalLabel = document.getElementById("baseTotalLabel");
    if (baseTotalLabel) baseTotalLabel.innerText = formattedBase;

    const multiplierTotalLabel = document.getElementById("multiplierTotalLabel");
    if (multiplierTotalLabel) multiplierTotalLabel.innerText = formattedMultiplier;

    document.getElementById("grandTotalLabel").innerText = formattedGrand; 
    document.getElementById("grandTotalLabel").dataset.value = Math.round(grandTotal); 
    
    const floatingLabel = document.getElementById("floatingGrandTotalLabel");
    if (floatingLabel) {
      floatingLabel.innerText = formattedGrand;
      floatingLabel.dataset.value = Math.round(grandTotal);
    }
    
    const widgetTotal = document.getElementById("floatingWidgetTotal");
    if (widgetTotal) {
      widgetTotal.innerText = formattedGrand;
    }

    // 3. Target Budget & Budget Warning Analyzer
    const targetBudgetInput = document.getElementById("targetBudget");
    const targetBudget = parseFloat(targetBudgetInput ? targetBudgetInput.value : 0)||0;
    const bar = document.getElementById("budgetProgressBar");
    const percentText = document.getElementById("budgetAnalysisPercent");
    const msgText = document.getElementById("budgetMessage");
    const grandTotalLabelElement = document.getElementById("grandTotalLabel");

    if (targetBudget > 0) {
      const percent = Math.round((grandTotal / targetBudget) * 100);
      if (percentText) percentText.innerText = percent + "% Terpakai";
      
      if (bar) {
        bar.style.width = Math.min(percent, 100) + "%";
        if (percent > 100) {
          bar.className = "h-full bg-gradient-to-r from-rose-500 to-red-650 transition-all duration-500 w-full animate-pulse";
          if (msgText) {
            msgText.innerHTML = `⚠️ OVER BUDGET! Melebihi target sebesar Rp ${(Math.round(grandTotal) - targetBudget).toLocaleString('id-ID')}`;
            msgText.className = "text-xs font-black text-rose-600 animate-pulse transition-all duration-300";
          }
          if (grandTotalLabelElement) {
            grandTotalLabelElement.className = "text-4xl md:text-5xl font-black text-rose-600 tracking-tighter drop-shadow-[0_0_15px_rgba(239,68,68,0.3)] animate-pulse";
          }
          // Highlight the single row with the highest subtotal
          if (maxSubtotalRowId) {
            const maxRow = document.getElementById(maxSubtotalRowId);
            if (maxRow) {
              maxRow.classList.add("border-rose-400", "bg-rose-50/30", "shadow-rose-100/50", "shadow-lg");
            }
          }
        } else {
          bar.className = "h-full bg-gradient-to-r from-emerald-400 to-emerald-500 transition-all duration-500";
          if (msgText) {
            msgText.innerHTML = `✓ Anggaran aman dalam batas target (Tersisa Rp ${(targetBudget - Math.round(grandTotal)).toLocaleString('id-ID')}).`;
            msgText.className = "text-xs font-bold text-emerald-600 transition-all duration-300";
          }
          if (grandTotalLabelElement) {
            grandTotalLabelElement.className = "text-4xl md:text-5xl font-black text-slate-900 tracking-tighter";
          }
        }
      }
    } else {
      if (percentText) percentText.innerText = "0% Terpakai";
      if (bar) {
        bar.style.width = "0%";
        bar.className = "h-full bg-slate-200 transition-all duration-500";
      }
      if (msgText) {
        msgText.innerHTML = "Masukkan target anggaran untuk mengaktifkan pelacak.";
        msgText.className = "text-xs font-semibold text-slate-400 transition-all duration-300";
      }
      if (grandTotalLabelElement) {
        grandTotalLabelElement.className = "text-4xl md:text-5xl font-black text-slate-900 tracking-tighter";
      }
    }
    
    updateChart(fb); 
    saveWorkspaceToLocalStorage();
  }

  function makeWidgetDraggable() {
    const widget = document.getElementById("floatingChartWidget");
    if (!widget) return;
    
    const triggerBtn = widget.querySelector("button.transform");
    const cardHeader = document.getElementById("floatingChartCard").firstElementChild;
    
    if (triggerBtn) triggerBtn.style.cursor = "move";
    if (cardHeader) cardHeader.style.cursor = "move";
    
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let widgetOriginalLeft = 0, widgetOriginalTop = 0;
    
    const dragHandles = [triggerBtn, cardHeader];
    dragHandles.forEach(handle => {
      if (!handle) return;
      handle.addEventListener("mousedown", dragStart);
      handle.addEventListener("touchstart", dragStart, { passive: true });
    });

    function dragStart(e) {
      if (e.target.closest("button") && !e.target.closest("button").classList.contains("transform")) {
        return; 
      }
      
      isDragging = true;
      wasDragging = false;
      
      const rect = widget.getBoundingClientRect();
      widgetOriginalLeft = rect.left;
      widgetOriginalTop = rect.top;
      
      const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
      
      dragStartX = clientX;
      dragStartY = clientY;
      
      document.addEventListener("mousemove", dragMove);
      document.addEventListener("touchmove", dragMove, { passive: false });
      document.addEventListener("mouseup", dragEnd);
      document.addEventListener("touchend", dragEnd);
    }

    function dragMove(e) {
      if (!isDragging) return;
      
      const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
      
      const deltaX = clientX - dragStartX;
      const deltaY = clientY - dragStartY;
      
      if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
        wasDragging = true;
      }
      
      if (wasDragging) {
        widget.style.bottom = "auto";
        widget.style.right = "auto";
        
        let newLeft = widgetOriginalLeft + deltaX;
        let newTop = widgetOriginalTop + deltaY;
        
        const rect = widget.getBoundingClientRect();
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        
        if (newLeft < 10) newLeft = 10;
        if (newLeft + rect.width > screenWidth - 10) newLeft = screenWidth - rect.width - 10;
        
        if (newTop < 10) newTop = 10;
        if (newTop + rect.height > screenHeight - 10) newTop = screenHeight - rect.height - 10;
        
        widget.style.left = newLeft + "px";
        widget.style.top = newTop + "px";
      }
      
      if (e.type === "touchmove" && wasDragging) {
        e.preventDefault();
      }
    }

    function dragEnd() {
      isDragging = false;
      document.removeEventListener("mousemove", dragMove);
      document.removeEventListener("touchmove", dragMove);
      document.removeEventListener("mouseup", dragEnd);
      document.removeEventListener("touchend", dragEnd);
      
      if (wasDragging) {
        setTimeout(() => { wasDragging = false; }, 50);
      }
    }
  }

        materialName: rows[i].querySelector(".material-name").value.trim(),
        unit: rows[i].querySelector(".unit-input").value.trim(),
        qty: parseFloat(rows[i].querySelector(".qty-input").value) || 0,
        unitPrice: parseFloat(rows[i].querySelector(".custom-price-input").value) || 0,
        subtotal: parseFloat(rows[i].getAttribute("data-subtotal")) || 0
      });
    }
    
    const activeProjId = document.getElementById("projectName").getAttribute("data-active-project-id") || "";
    const contingencyRate = parseFloat(document.getElementById("contingencyRate").value)||0;
    const markupRate = parseFloat(document.getElementById("markupRate").value)||0;

    showLoading(true, "Mengekspor data ke Excel (.xlsx) dengan formula aktif...");
    
    google.script.run
      .withFailureHandler(err => { 
        showLoading(false); 
        alert("Gagal mengunduh Excel: " + err.message); 
      })
      .withSuccessHandler(res => {
        showLoading(false);
        if (res.success) {
          showToast("Unduhan Excel siap!", "success");
          window.open(res.downloadUrl, "_blank");
        } else {
          alert("Gagal mengunduh Excel: " + res.error);
        }
      }).generateExcelRAB({
        projectId: activeProjId,
        projectName: p,
        clientEmail: e,
        userNote: n,
        contingencyRate: contingencyRate,
        markupRate: markupRate,
        items: items
      });
  }

  function toggleApiHub(event) {
    if(event) event.stopPropagation();
    const content = document.getElementById("apiHubContent");
    const btn = event ? event.currentTarget : null;
    if (!content) return;
    if (content.classList.contains("hidden")) {
      content.classList.remove("hidden");
      if (btn) btn.innerText = "Tutup ↑";
    } else {
      content.classList.add("hidden");
      if (btn) btn.innerText = "Buka ↓";
    }
  }

  // ==========================================
  // FITUR PREMIUM: AUTO-SAVE & SESSION RESTORE
  // ==========================================

  function saveWorkspaceToLocalStorage() {
    try {
      if (!sessionUser) return; // Simpan hanya jika sesi login aktif

      const projectName = document.getElementById("projectName").value.trim();
      const clientEmail = document.getElementById("clientEmail").value.trim();
      const userNote = document.getElementById("userNote").value.trim();
      const targetBudget = parseFloat(document.getElementById("targetBudget").value) || 0;
      const contingencyRate = parseFloat(document.getElementById("contingencyRate").value) || 0;
      const markupRate = parseFloat(document.getElementById("markupRate").value) || 0;
      const activeProjectId = document.getElementById("projectName").getAttribute("data-active-project-id") || "";
      
      // Mengambil item-item tabel kalkulasi
      const rows = document.getElementById("calculatorBody").children;
      const items = [];
      for (let r of rows) {
        // Mencegah error jika input tidak ditemukan
        const fixInput = r.querySelector(".fixture-name");
        const matInput = r.querySelector(".material-name");
        const unitInput = r.querySelector(".unit-input");
        const qtyInput = r.querySelector(".qty-input");
        const priceInput = r.querySelector(".custom-price-input");
        const refLinkArea = r.querySelector(".ref-link-area");

        if (fixInput && matInput) {
          items.push({
            fixtureName: fixInput.value,
            materialName: matInput.value,
            unit: unitInput ? unitInput.value : "ea",
            qty: qtyInput ? parseFloat(qtyInput.value) || 0 : 0,
            unitPrice: priceInput ? parseFloat(priceInput.value) || 0 : 0,
            refHtml: refLinkArea ? refLinkArea.innerHTML : "",
            prevPrice: r.getAttribute("data-prev-price") || "",
            prevRef: r.getAttribute("data-prev-ref") || "",
            researchedPrice: r.getAttribute("data-researched-price") || "",
            researchedRef: r.getAttribute("data-researched-ref") || "",
            subtotal: parseFloat(r.getAttribute("data-subtotal")) || 0
          });
        }
      }

      // Mengambil log chat AI Brainstormer
      const chatHistoryDiv = document.getElementById("chatHistory");
      const chatMessages = [];
      if (chatHistoryDiv) {
        const children = Array.from(chatHistoryDiv.children);
        children.forEach(child => {
          if (child.classList.contains("italic") && child.innerText.includes("Mulai percakapan")) return;
          
          const isUser = child.classList.contains("text-right");
          const isAssistant = child.classList.contains("text-left");
          
          if (isUser || isAssistant) {
            chatMessages.push({
              type: isUser ? "user" : "assistant",
              html: child.innerHTML
            });
          }
        });
      }

      const payload = {
        projectName,
        clientEmail,
        userNote,
        targetBudget,
        contingencyRate,
        markupRate,
        activeProjectId,
        items,
        chatMessages: chatMessages.slice(-15), // Batasi 15 log pesan terakhir
        currentUploadedImageBase64,
        timestamp: Date.now()
      };

      localStorage.setItem("stella_rab_draft_session", JSON.stringify(payload));
    } catch (err) {
      console.error("Gagal melakukan auto-save ke localStorage: ", err);
    }
  }

  function checkForSavedWorkspace() {
    try {
      const rawData = localStorage.getItem("stella_rab_draft_session");
      if (!rawData) return;

      const payload = JSON.parse(rawData);
      if (!payload) return;

      const hasItems = payload.items && payload.items.length > 0;
      const hasProjInfo = payload.projectName || payload.clientEmail || payload.targetBudget > 0;
      const hasChat = payload.chatMessages && payload.chatMessages.length > 0;

      if (!hasItems && !hasProjInfo && !hasChat) {
        localStorage.removeItem("stella_rab_draft_session");
        return;
      }

      // Mengisi metadata di modal pemulihan draf
      document.getElementById("restoreProjName").innerText = payload.projectName || "(Tanpa Nama Proyek)";
      document.getElementById("restoreProjItems").innerText = (payload.items ? payload.items.length : 0) + " Item kalkulasi";
      
      const baseTotal = (payload.items || []).reduce((acc, item) => acc + ((item.qty || 0) * (item.unitPrice || 0)), 0);
      const subtotalAfterContingency = baseTotal * (1 + (payload.contingencyRate || 0) / 100);
      const grandTotal = subtotalAfterContingency * (1 + (payload.markupRate || 0) / 100);
      document.getElementById("restoreProjTotal").innerText = "Rp " + Math.round(grandTotal).toLocaleString('id-ID');

      // Tampilkan modal pemulihan draf secara elegan
      const modal = document.getElementById("restoreSessionModal");
      if (modal) {
        setTimeout(() => {
          modal.classList.remove("opacity-0", "pointer-events-none");
          modal.querySelector("div").classList.remove("scale-95");
        }, 300);
      }
    } catch (err) {
      console.error("Gagal memeriksa draf tersimpan: ", err);
    }
  }

  function restoreWorkspaceDraft() {
    try {
      const rawData = localStorage.getItem("stella_rab_draft_session");
      if (!rawData) return closeRestoreModal(false);

      const payload = JSON.parse(rawData);
      if (!payload) return closeRestoreModal(false);

      showLoading(true, "Memulihkan sesi pekerjaan Anda...");

      // Pulihkan Informasi Proyek
      document.getElementById("projectName").value = payload.projectName || "";
      document.getElementById("clientEmail").value = payload.clientEmail || "";
      document.getElementById("userNote").value = payload.userNote || "";
      document.getElementById("targetBudget").value = payload.targetBudget || "";
      document.getElementById("contingencyRate").value = payload.contingencyRate || 0;
      document.getElementById("markupRate").value = payload.markupRate || 0;
      
      if (payload.activeProjectId) {
        document.getElementById("projectName").setAttribute("data-active-project-id", payload.activeProjectId);
      } else {
        document.getElementById("projectName").removeAttribute("data-active-project-id");
      }

      // Pulihkan gambar base64 untuk chat brainstorm
      currentUploadedImageBase64 = payload.currentUploadedImageBase64 || "";

      // Pulihkan baris tabel Lembar Kalkulasi
      const tbody = document.getElementById("calculatorBody");
      tbody.innerHTML = ""; // Bersihkan tabel default

      if (payload.items && payload.items.length > 0) {
        payload.items.forEach(item => {
          const rowId = "row_" + Date.now() + "_" + Math.floor(Math.random()*1000) + "_" + Math.floor(Math.random()*1000);
          const tr = document.createElement("tr");
          tr.id = rowId;
          tr.className = "text-sm border-b border-slate-100 hover:bg-slate-50 transition flex flex-col md:table-row mb-4 md:bg-transparent rounded-2xl md:rounded-none overflow-hidden bg-white shadow-sm md:shadow-none";
          
          tr.innerHTML = `
            <td class="p-3 md:p-4 flex flex-col md:table-cell border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400 mb-1">Fixture</span>
               <input type="text" value="${item.fixtureName || ''}" oninput="saveWorkspaceToLocalStorage()" class="fixture-name w-full p-2 bg-transparent border border-slate-200 md:border-0 rounded-lg outline-none font-medium" placeholder="Bagian Ruangan">
            </td>
            <td class="p-3 md:p-4 flex flex-col md:table-cell border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400 mb-1">Material</span>
               <input type="text" value="${item.materialName || ''}" oninput="saveWorkspaceToLocalStorage()" class="material-name w-full p-2 bg-transparent border border-slate-200 md:border-0 rounded-lg outline-none font-bold text-blue-700" placeholder="Nama Material">
            </td>
            <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Satuan</span>
               <input type="text" value="${item.unit || 'ea'}" oninput="saveWorkspaceToLocalStorage()" class="unit-input w-16 p-2 text-center border border-slate-200 rounded-xl font-bold bg-slate-50 text-slate-900 text-xs" placeholder="ea">
            </td>
            <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">QTY</span>
               <input type="number" step="0.01" value="${item.qty || 1}" oninput="calcRow('${rowId}')" class="qty-input w-24 p-2 text-center border border-slate-200 rounded-xl font-bold bg-slate-50">
            </td>
            <td class="p-3 md:p-4 flex justify-between items-center md:table-cell border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Harga Satuan</span>
               <div class="flex items-center font-mono">Rp <input type="number" value="${item.unitPrice || 0}" oninput="calcRow('${rowId}')" class="custom-price-input w-28 p-2 border border-slate-200 rounded-xl font-bold bg-slate-50 text-slate-900 ml-1"></div>
            </td>
            <td class="p-3 md:p-4 flex flex-col justify-center items-center border-b md:border-0 border-slate-100 gap-1">
               <div class="grid grid-cols-2 gap-1 w-full max-w-[180px] md:max-w-none">
                  <button onclick="runGeminiResearch('${rowId}')" title="Gemini AI Google Search Grounding (Direkomendasikan - Sangat Akurat)" class="col-span-2 text-[9px] bg-purple-600 hover:bg-purple-700 text-white p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 shadow-sm shadow-purple-500/20">🤖 AI (Grounding)</button>
                  <button onclick="runSerpApiResearch('${rowId}')" title="Google Shopping via SerpApi (Kuota Premium)" class="text-[9px] bg-amber-50 hover:bg-amber-100 text-amber-700 p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 border border-amber-200/50">⚡ Serp</button>
                  <button onclick="openManualWebSearch('${rowId}')" title="Cari Manual Gratis via Tab Baru" class="text-[9px] bg-slate-50 hover:bg-slate-100 text-slate-700 p-1.5 rounded-lg font-bold transition flex items-center justify-center gap-0.5 border border-slate-200/50">🔍 Web</button>
               </div>
               <div class="ref-link-area text-center w-full mt-1">${item.refHtml || ""}</div>
            </td>
            <td class="p-4 md:p-4 flex justify-between items-center md:table-cell bg-slate-50 md:bg-transparent border-b md:border-0 border-slate-100">
               <span class="md:hidden font-bold text-[11px] uppercase text-slate-400">Subtotal</span>
               <span class="subtotal-label text-right font-black font-mono text-lg md:text-base text-slate-900">Rp 0</span>
            </td>
            <td class="p-3 md:p-4 flex justify-center items-center bg-rose-50/50 md:bg-transparent">
               <button onclick="document.getElementById('${rowId}').remove(); recalculateGrandTotal();" class="text-rose-500 font-bold p-2 w-full md:w-auto rounded-lg">✕</button>
            </td>
          `;

          // Terapkan border visual status harga acuan (Master vs AI)
          const priceInput = tr.querySelector(".custom-price-input");
          if (item.refHtml && item.refHtml.includes("📋 MASTER")) {
            priceInput.className = "custom-price-input w-28 p-2 border-2 border-emerald-500 rounded-xl font-black bg-emerald-50 text-emerald-900 ml-1 transition-all";
          } else if (item.refHtml && (item.refHtml.includes("🤖") || item.refHtml.includes("🌐 Link AI"))) {
            priceInput.className = "custom-price-input w-28 p-2 border-2 border-purple-400 rounded-xl font-bold bg-purple-50/50 text-purple-950 ml-1 transition-all";
          }

          // Pulihkan atribut history undo/redo
          if (item.prevPrice) tr.setAttribute("data-prev-price", item.prevPrice);
          if (item.prevRef) tr.setAttribute("data-prev-ref", item.prevRef);
          if (item.researchedPrice) tr.setAttribute("data-researched-price", item.researchedPrice);
          if (item.researchedRef) tr.setAttribute("data-researched-ref", item.researchedRef);

          tbody.appendChild(tr);
          
          // Kalkulasi subtotal baris
          const sub = (item.qty || 0) * (item.unitPrice || 0);
          tr.querySelector(".subtotal-label").innerText = "Rp " + sub.toLocaleString('id-ID');
          tr.setAttribute("data-subtotal", sub);
        });
      } else {
        addNewRow();
      }

      // Pulihkan log chat AI Brainstormer
      const chatHistoryDiv = document.getElementById("chatHistory");
      if (chatHistoryDiv && payload.chatMessages && payload.chatMessages.length > 0) {
        chatHistoryDiv.innerHTML = ""; // Bersihkan placeholder default
        payload.chatMessages.forEach(msg => {
          const bubble = document.createElement("div");
          bubble.className = msg.type === "user" ? "text-right mb-2" : "text-left mb-2";
          bubble.innerHTML = msg.html;
          chatHistoryDiv.appendChild(bubble);
        });
        chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
      }

      // Jalankan kalkulasi total akhir secara live
      recalculateGrandTotal();
      showLoading(false);
      closeRestoreModal(false);
      showToast("Sesi draf berhasil dipulihkan!", "success");
      playCompletionChime();
    } catch (err) {
      showLoading(false);
      console.error("Gagal memulihkan draf: ", err);
      alert("Terjadi kesalahan saat memulihkan draf: " + err.message);
    }
  }

  function closeRestoreModal(discard = false) {
    const modal = document.getElementById("restoreSessionModal");
    if (modal) {
      modal.querySelector("div").classList.add("scale-95");
      modal.classList.add("opacity-0", "pointer-events-none");
    }
    if (discard) {
      localStorage.removeItem("stella_rab_draft_session");
      showToast("Draf sesi berhasil dihapus.", "info");
      const tbody = document.getElementById("calculatorBody");
      if (tbody && tbody.children.length === 0) {
        addNewRow();
      }
    }
  }
</script>
